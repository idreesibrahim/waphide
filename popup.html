<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WAPHIDE Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { width: 300px; background-color: #111b21; color: #e9edef; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; padding-bottom: 12px; margin-bottom: 14px; }
    .title { font-size: 18px; font-weight: bold; color: #00a884; letter-spacing: 0.5px; }
    .subtitle { font-size: 10px; color: #8696a0; text-transform: uppercase; }
    
    .main-toggle { display: flex; align-items: center; justify-content: space-between; background: #202c33; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
    .main-toggle label { font-weight: 600; font-size: 14px; }

    .feature-list { display: flex; flex-direction: column; gap: 10px; }
    .feature-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #d1d7db; }

    /* Switch styling */
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374248; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #8696a0; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #00a884; }
    input:checked + .slider:before { transform: translateX(18px); background-color: #fff; }

    .shortcut-info { margin-top: 14px; font-size: 11px; color: #8696a0; text-align: center; border-top: 1px solid #222d34; padding-top: 10px; }
    .shortcut-key { background: #202c33; padding: 2px 6px; border-radius: 4px; color: #00a884; font-weight: bold; }
    .footer { text-align: center; margin-top: 10px; font-size: 10px; color: #00a884; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">WAPHIDE</div>
      <div class="subtitle">WhatsApp Web Privacy</div>
    </div>
  </div>

  <div class="main-toggle">
    <label for="masterToggle">Enable WAPHIDE</label>
    <label class="switch">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="feature-list">
    <div class="feature-item">
      <span>Profile Pictures</span>
      <label class="switch">
        <input type="checkbox" id="blurAvatars" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="feature-item">
      <span>Last Message Preview</span>
      <label class="switch">
        <input type="checkbox" id="blurPreviews" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="feature-item">
      <span>All Messages in Chat</span>
      <label class="switch">
        <input type="checkbox" id="blurMessages" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="feature-item">
      <span>Media Preview (Images/Videos)</span>
      <label class="switch">
        <input type="checkbox" id="blurMedia" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="shortcut-info">
    Quick Toggle Shortcut: <span class="shortcut-key">Alt + X</span>
  </div>

  <div class="footer">
    DESIGNED BY IDREESIB
  </div>

  <script src="popup.js"></script>
</body>
</html>
